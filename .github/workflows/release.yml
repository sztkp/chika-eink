name: Release candidate

# Public distribution review is still open. Build candidates only; no automatic publishing.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag (for example v0.2.1-eink.1)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  candidate:
    name: Test and build signed candidate
    runs-on: ubuntu-latest
    steps:
      - name: Validate version tag
        id: ver
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Expected a version tag such as v0.2.1 or v0.2.1-eink.1" >&2
            exit 1
          fi
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout tagged source
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" || -z "$KEYSTORE_PASSWORD" || -z "$KEY_ALIAS" || -z "$KEY_PASSWORD" ]]; then
            echo "Configure all four signing secrets before building a signed candidate." >&2
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default includes the obsolete SDK "tools" package.
          packages: platform-tools

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.1.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test, lint, and build signed AAB and APK
        env:
          KEYSTORE_FILE: ${{ runner.temp }}/release.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_NAME: ${{ steps.ver.outputs.name }}
        run: |
          chmod +x ./gradlew
          ./gradlew :shared:jvmTest :app:testDebugUnitTest :app:lintDebug :app:bundleRelease :app:assembleRelease --stacktrace

      - name: Upload release candidate
        uses: actions/upload-artifact@v4
        with:
          name: chika-eink-${{ steps.ver.outputs.name }}-candidate
          if-no-files-found: error
          path: |
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/apk/release/*.apk
            app/build/outputs/mapping/release/mapping.txt

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-lint-report
          path: app/build/reports/lint-results-*.html
          if-no-files-found: ignore
